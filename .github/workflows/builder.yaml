name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "smart-home-suite-manager/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/abel-smart-home/smart-home-suite-manager
  APP_DIR: smart-home-suite-manager

jobs:
  validate:
    name: Validate release payload
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository without external Actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Validate package structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 "${APP_DIR}/scripts/validate_release.py"

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q "${APP_DIR}/payload/smart_home_suite"

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n "${APP_DIR}/run.sh"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in "${APP_DIR}"/payload/smart_home_suite/frontend/*.js; do
            node --check "${file}"
          done

      - name: Validation complete
        shell: bash
        run: echo "CI_VALIDATION_OK"

  build-amd64:
    name: Build amd64
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository without external Actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${APP_DIR}/config.yaml")"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Building Smart Home Suite Manager ${VERSION} for amd64"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push amd64
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_ARCH="amd64" \
            --tag "${IMAGE}:${VERSION}-amd64" \
            --tag "${IMAGE}:latest-amd64" \
            "${APP_DIR}"

          docker push "${IMAGE}:${VERSION}-amd64"
          docker push "${IMAGE}:latest-amd64"

  build-aarch64:
    name: Build aarch64
    needs: validate
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository without external Actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${APP_DIR}/config.yaml")"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Building Smart Home Suite Manager ${VERSION} for aarch64"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push aarch64
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_ARCH="aarch64" \
            --tag "${IMAGE}:${VERSION}-aarch64" \
            --tag "${IMAGE}:latest-aarch64" \
            "${APP_DIR}"

          docker push "${IMAGE}:${VERSION}-aarch64"
          docker push "${IMAGE}:latest-aarch64"

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs:
      - build-amd64
      - build-aarch64
    steps:
      - name: Verify matching versions
        shell: bash
        env:
          AMD64_VERSION: ${{ needs.build-amd64.outputs.version }}
          AARCH64_VERSION: ${{ needs.build-aarch64.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${AMD64_VERSION}"
          test "${AMD64_VERSION}" = "${AARCH64_VERSION}"
          echo "VERSION=${AMD64_VERSION}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish version manifest
        shell: bash
        run: |
          set -euo pipefail
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-aarch64"
          docker manifest push "${IMAGE}:${VERSION}"

      - name: Publish latest manifest
        shell: bash
        run: |
          set -euo pipefail
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-aarch64"
          docker manifest push "${IMAGE}:latest"

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect "${IMAGE}:${VERSION}"
          docker manifest inspect "${IMAGE}:latest"
          echo "MULTIARCH_PUBLISH_OK"
